<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Form - FootFlick</title>


<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  background: #000;
  color: #f5f5f5;
}

.header {
  background: #111;
  padding: 20px;
  text-align: center;
  border-bottom: 2px solid #b8860b;
}

h1 {
  color: #b8860b;
}

form {
  max-width: 500px;
  margin: 40px auto;
  background: #111;
  padding: 30px;
  border: 1px solid #b8860b;
  border-radius: 10px;
}

label {
  display: block;
  margin-top: 15px;
}

input, select, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border: none;
}

button {
  margin-top: 15px;
  padding: 10px;
  width: 48%;
  border: none;
  cursor: pointer;
}

.submit-btn {
  background: #b8860b;
}

.reset-btn {
  background: #800020;
  color: #fff;
}

a {
      text-decoration: none;
      color: #b8860b;
      transition: color 0.3s;
      margin-top: 15px;
      padding: 10px;
      width: 48%;
      border: none;
      cursor: pointer;
}

button:hover {
  opacity: 0.8;
}
</style>
</head>

<body>

<div class="header">
  <h1>FootFlick Order Form</h1>
</div>

<form action="#" method="post">

  <!-- Name -->
  <label for="name">Full Name:</label>
  <input type="text" id="name" name="name" required>

  <!-- Email -->
  <label for="email">Email:</label>
  <input type="email" id="email" name="email" required>

  <!-- Password -->
  <label for="password">Password:</label>
  <input type="password" id="password" name="password" required>

  <!-- Radio -->
  <label>Gender:</label>
  <input type="radio" name="gender" value="Male"> Male
  <input type="radio" name="gender" value="Female"> Female

  <!-- Checkbox -->
  <label>Preferred Style:</label>
  <input type="checkbox" name="style" value="Sneakers"> Sneakers
  <input type="checkbox" name="style" value="Running"> Running
  <input type="checkbox" name="style" value="Casual"> Casual

  <!-- Dropdown -->
  <label for="product">Select Product:</label>
  <select id="product" name="product">
    <option>Sneakers</option>
    <option>Running Shoes</option>
    <option>Casual Shoes</option>
  </select>

  <!-- Textarea -->
  <label for="address">Shipping Address:</label>
  <textarea id="address" rows="4"></textarea>

  <!-- Buttons -->
  <div style="display:flex; justify-content: space-between;">
    <button type="submit" class="submit-btn">Submit</button>
    <button type="reset" class="reset-btn">Reset</button>
    <a href="code1.html">Back</a> <br>
  </div>

</form>

</body>
</html>
