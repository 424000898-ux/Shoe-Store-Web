<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - FootFlick</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #000;
      color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #111;
      padding: 40px;
      border: 1px solid #b8860b;
      border-radius: 10px;
      text-align: center;
      width: 300px;
    }

    h2 { color: #b8860b; }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      outline: none;
    }

    button {
      background: #b8860b;
      border: none;
      padding: 10px;
      width: 100%;
      cursor: pointer;
    }

    a {
      color: #b8860b;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Register</h2>
  <form onsubmit="registerUser(event)">
    <input type="text" id="user" placeholder="Username" required>
    <input type="password" id="pass" placeholder="Password" required>
    <button type="submit">Register</button>
  </form>
  <p>May account na? <a href="login.html">Login</a></p>
</div>

<script>
function registerUser(e) {
  e.preventDefault();

  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  localStorage.setItem(u, p);

  alert("Registered!");
  window.location.href = "login.html";
}
</script>

</body>
</html>
