<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - FootFlick</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #000;
      color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #111;
      padding: 40px;
      border: 1px solid #b8860b;
      border-radius: 10px;
      text-align: center;
      width: 300px;
    }

    h2 { color: #b8860b; }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      outline: none;
    }

    button {
      background: #b8860b;
      border: none;
      padding: 10px;
      width: 100%;
      cursor: pointer;
    }

    a {
      color: #b8860b;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Login</h2>
  <form onsubmit="loginUser(event)">
    <input type="text" id="user" placeholder="Username" required>
    <input type="password" id="pass" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>
  <p>Don't have an account? <a href="register.html">Register</a></p>
</div>

<script>
function loginUser(e) {
  e.preventDefault();

  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  let stored = localStorage.getItem(u);

  if (stored === p) {
    localStorage.setItem("loggedInUser", u);
    alert("Login successful!");
    window.location.href = "code1.html";
  } else {
    alert("Invalid account!");
  }
}
</script>

</body>
</html>
