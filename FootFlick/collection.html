<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Collection - FootFlick</title>
<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  background: #000;
  color: #f5f5f5;
}
h1 {
  text-align: center;
  color: #b8860b;
  padding: 20px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  padding: 40px;
}
.card {
  background: #111;
  border: 1px solid #b8860b;
  text-align: center;
  padding: 15px;
}
.card img {
  width: 100%;
}
 body {
      margin: 0;
      font-family: 'Georgia', serif;
      background: #000;
      color: #f5f5f5;
    }

    h1, h2, h3 {
      color: #b8860b; /* Gold accents */
    }

    a {
      text-decoration: none;
      color: #b8860b;
      transition: color 0.3s;
    }
    a:hover {
      color: #800020; /* Burgundy hover */
    }

    /* Header */
    .header {
      background: #111;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #b8860b;
    }
    .header h1 {
      margin: 0;
      font-size: 2.5em;
      letter-spacing: 2px;
    }
   .nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav.center {
  justify-content: center; /* kapag logged in, lahat centered */
}

.nav-left a {
  margin-right: 15px;
}

#userArea {
  display: flex;
  align-items: center;
  gap: 10px;
}

#userArea span {
  color: #b8860b;
  font-weight: bold;
}

.logout-btn {
  border: 1px solid #b8860b;
  padding: 6px 12px;
  border-radius: 5px;
  cursor: pointer;
}

.logout-btn:hover {
  background: #800020;
  color: #fff;
}

</style>
</head>

<body>
    <div class="header">
    <h1>FootFlick</h1>
   <nav class="nav" id="navbar">
  <div class="nav-left">
    <a href="code1.html">Home</a>
    <a href="about.html">About</a>
    <a href="collection.html">Collection</a>
    <a href="contact.html">Contact</a>
  </div>

  <div class="nav-right" id="userArea">
    <a href="login.html">Login</a>
  </div>
</nav>
  </div>

<h1>Our Collection</h1>

<div class="grid">
  <div class="card">
    <img src="sneaker.jpg">
    <h3>Sneakers</h3>
  </div>

  <div class="card">
    <img src="running.jpg">
    <h3>Running Shoes</h3>
  </div>

  <div class="card">
    <img src="casual.jpg">
    <h3>Casual Shoes</h3>
  </div>

</div>
<script>
window.onload = function() {
  let user = localStorage.getItem("loggedInUser");

  let userArea = document.getElementById("userArea");
  let navbar = document.getElementById("navbar");

  if (user) {
    // Palitan Login ng Hi, user + Logout
    userArea.innerHTML = `
      <span>Hi, ${user} </span>
      <a href="#" class="logout-btn" onclick="logout()">Logout</a>
    `;

    // Center nav
    navbar.classList.add("center");
  }
}

function logout() {
  localStorage.removeItem("loggedInUser");
  alert("Logged out!");
  window.location.href = "code1.html"; // balik home
}
</script>
</body>
</html>
